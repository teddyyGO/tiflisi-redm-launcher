<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiflisi Launcher</title>
<meta name="description" content="Tiflisi Launcher: the free, open-source launcher for the Tiflisi 1898 RedM server.">
<link rel="icon" href="icon.png">
<style>
  /* Launcher palette and type (src/renderer/styles.css), website layout. */
  @font-face { font-family: "Big Shoulders Display Variable"; font-weight: 100 900; font-display: swap; src: url(fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Hanken Grotesk Variable"; font-weight: 100 900; font-display: swap; src: url(fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Georgian Variable"; font-weight: 100 900; font-display: swap; src: url(fonts/noto-sans-georgian-georgian-wght-normal.woff2) format("woff2"); unicode-range: U+0589, U+10A0-10FF, U+1C90-1CBA, U+1CBD-1CBF, U+205A, U+2D00-2D2F, U+2E31; }

  :root {
    --text: #f3eee6; --text-2: rgba(243, 238, 230, 0.74); --text-3: rgba(243, 238, 230, 0.5);
    --line: rgba(255, 240, 225, 0.12); --line-2: rgba(255, 240, 225, 0.22);
    --base: #15110f; --primary: #c41e1e; --btn-text: #fff6ee;
    --display: "Big Shoulders Display Variable", "Noto Sans Georgian Variable", "Arial Narrow", sans-serif;
    --ui: "Hanken Grotesk Variable", "Noto Sans Georgian Variable", "Segoe UI", sans-serif;
    --r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    color: var(--text); font: 400 16px/1.55 var(--ui); -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse 60% 520px at 50% 0, color-mix(in srgb, var(--primary) 22%, transparent), transparent 70%), var(--base);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: var(--r); }
  svg { width: 1em; height: 1em; flex-shrink: 0; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 1120px; margin: 0 auto; padding: 18px 24px; }
  header img { width: 28px; height: 28px; border-radius: 8px; }
  .brand { font: 700 19px/1 var(--display); letter-spacing: 0.01em; }
  .lang { margin-left: auto; display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(10, 8, 7, 0.5); border: 1px solid var(--line); }
  .lang button { height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--text-2); font: 600 13px/1 var(--ui); cursor: pointer; transition: background 0.2s, color 0.2s; }
  .lang button:hover { color: var(--text); }
  .lang button[aria-pressed="true"] { background: rgba(255, 245, 235, 0.15); color: var(--text); }
  .gh-link { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: var(--r); color: var(--text-2); font-size: 14px; font-weight: 560; transition: color 0.2s, background 0.2s; }
  .gh-link:hover { color: var(--text); background: rgba(255, 245, 235, 0.06); }

  main { flex: 1; text-align: center; padding: 64px 24px 0; }
  h1 { font: 800 clamp(52px, 8vw, 104px)/0.9 var(--display); letter-spacing: 0.005em; }
  .lead { margin: 18px auto 0; max-width: 46ch; font-size: 18px; color: var(--text-2); }
  :lang(ka) .lead { max-width: 60ch; } /* Georgian letters run wider than the "0" that ch measures */

  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 52px; padding: 0 24px; border-radius: var(--r); font-weight: 650; font-size: 16px; white-space: nowrap;
    transition: filter 0.2s, background 0.2s, transform 0.15s;
  }
  .btn svg { font-size: 19px; }
  .btn:active { transform: scale(0.98); }
  .primary { background: var(--primary); color: var(--btn-text); box-shadow: 0 14px 36px -14px var(--primary), inset 0 1px 0 rgba(255, 255, 255, 0.22); }
  .primary:hover { filter: brightness(1.1); }
  .ghost { background: rgba(255, 245, 235, 0.06); border: 1px solid var(--line-2); }
  .ghost:hover { background: rgba(255, 245, 235, 0.12); }
  .meta { margin-top: 14px; color: var(--text-3); font-size: 13.5px; }

  .shot { position: relative; max-width: 1040px; margin: 64px auto 0; }
  .shot::before { content: ""; position: absolute; inset: 10% 8% -4%; z-index: -1; background: var(--primary); filter: blur(90px); opacity: 0.32; }
  .shot img {
    display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line-2);
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.85);
  }

  footer { padding: 56px 24px 32px; text-align: center; color: var(--text-3); font-size: 13px; }
  footer a { text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--text-2); }

  @media (max-width: 560px) {
    header { padding: 14px 16px; }
    .gh-link span { display: none; }
    main { padding: 44px 16px 0; }
    .lead { font-size: 16.5px; }
    .btn { width: 100%; }
    .shot { margin-top: 44px; }
    .shot img { border-radius: 10px; }
  }
</style>
</head>
<body>
  <svg hidden><symbol id="gh" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol></svg>
  <header>
    <img src="icon.png" alt="">
    <span class="brand">Tiflisi Launcher</span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true" aria-label="English">EN</button>
      <button type="button" data-lang="ka" aria-pressed="false" aria-label="ქართული">ქარ</button>
    </div>
    <a class="gh-link" href="https://github.com/teddyyGO/tiflisi-redm-launcher" aria-label="GitHub">
      <svg aria-hidden="true"><use href="#gh"/></svg>
      <span>GitHub</span>
    </a>
  </header>

  <main>
    <h1>Tiflisi Launcher</h1>
    <p class="lead" data-i18n="lead">Join your server in one click, browse every public RedM server, and fix the usual game problems. Free and open source.</p>
    <div class="actions">
      <a class="btn primary" id="dl" href="https://github.com/teddyyGO/tiflisi-redm-launcher/releases/latest">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M128 40v112M80 108l48 44 48-44M40 168v32a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16v-32"/></svg>
        <span data-i18n="dl">Download for Windows</span>
      </a>
      <a class="btn ghost" href="https://github.com/teddyyGO/tiflisi-redm-launcher">
        <svg aria-hidden="true"><use href="#gh"/></svg>
        <span data-i18n="gh">View on GitHub</span>
      </a>
    </div>
    <p class="meta" id="meta">Windows 10 / 11</p>

    <div class="shot">
      <img id="shot" src="launcher.jpg" width="1180" height="720" alt="The launcher's home screen: featured server, live player count and Join button">
    </div>
  </main>

  <footer>
    <a href="https://github.com/teddyyGO/tiflisi-redm-launcher/blob/main/LICENSE" data-i18n="license">MIT license</a> · <span data-i18n="disclaimer">Not affiliated with Rockstar Games or Cfx.re</span>
  </footer>

<script>
  // Installer names carry the version, so resolve the latest .exe at runtime; the href above is the no-JS fallback.
  fetch('https://api.github.com/repos/teddyyGO/tiflisi-redm-launcher/releases/latest')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(rel => {
      const exe = rel.assets.find(a => a.name.endsWith('.exe'));
      if (!exe) return;
      document.getElementById('dl').href = exe.browser_download_url;
      document.getElementById('meta').textContent = `${rel.tag_name} · Windows 10 / 11 · ${Math.round(exe.size / 1048576)} MB`;
    })
    .catch(() => {});

  // English lives in the HTML; Georgian swaps the text and the screenshot. Pick: ?lang= link, saved choice, browser language.
  const KA = {
    lead: 'შედით სერვერზე ერთი დაჭერით, დაათვალიერეთ ყველა საჯარო RedM სერვერი და მოაგვარეთ თამაშის ხშირი პრობლემები. უფასო და ღია კოდით.',
    dl: 'ჩამოტვირთვა Windows-ისთვის',
    gh: 'GitHub-ზე ნახვა',
    license: 'MIT ლიცენზია',
    disclaimer: 'არ არის დაკავშირებული Rockstar Games-თან ან Cfx.re-თან',
    alt: 'ლაუნჩერის მთავარი ეკრანი: რჩეული სერვერი, მოთამაშეების რაოდენობა და შესვლის ღილაკი',
  };
  const nodes = document.querySelectorAll('[data-i18n]'), shot = document.getElementById('shot');
  const EN = { alt: shot.alt };
  nodes.forEach(n => EN[n.dataset.i18n] = n.textContent);

  function setLang(lang) {
    const t = lang === 'ka' ? KA : EN;
    document.documentElement.lang = lang;
    nodes.forEach(n => n.textContent = t[n.dataset.i18n]);
    shot.src = lang === 'ka' ? 'launcher-ka.jpg' : 'launcher.jpg';
    shot.alt = t.alt;
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    setLang(b.dataset.lang);
    try { localStorage.setItem('lang', b.dataset.lang); } catch {}
  }));

  let lang = new URLSearchParams(location.search).get('lang');
  if (!lang) try { lang = localStorage.getItem('lang'); } catch {}
  if (!lang) lang = (navigator.languages || [navigator.language]).some(l => l.startsWith('ka')) ? 'ka' : 'en';
  if (lang === 'ka') setLang('ka');
</script>
</body>
</html>
