# Push a version tag (git tag v1.1.0 && git push --tags) and this builds the Windows installer
# and publishes it as a GitHub release. Installed launchers see it within 30 minutes and update with one click.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (removes the SmartScreen "unknown publisher" warning): add these repo secrets.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # The build uploads into a draft. Publish only now that every file (installer, latest.yml,
      # blockmap) is there, so no launcher can see a release whose update file is still missing.
      - name: Publish the release
        # The notes link the code signing and privacy policies (SignPath wants both on every release page).
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
